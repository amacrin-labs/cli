repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check amacrin
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: tests
        entry: uv run pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
